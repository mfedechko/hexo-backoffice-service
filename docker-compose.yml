services:
  postgres:
    image: postgres:16-alpine
    container_name: hexo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: backoffice
      POSTGRES_USER: backoffice_user
      POSTGRES_PASSWORD: backoffice_pass
    ports:
      - "5432:5432"
    volumes:
      - hexo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backoffice_user -d backoffice"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hexo_postgres_data:
