spring:
  application:
    name: hexo-backoffice

  # Active profile: override with -Dspring.profiles.active=prod on the server
  profiles:
    active: local

  jpa:
    hibernate:
      # 'update' is fine for dev; switch to 'validate' in prod once schema is stable
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  cors:
    allowed-origins: https://shchoglagpn.com.ua

---
# ── LOCAL profile (Docker Postgres) ──────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/backoffice
    username: backoffice_user
    password: backoffice_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

---
# ── PROD profile (hosting Postgres) ──────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://YOUR_PROD_HOST:5432/backoffice
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 8080
