spring:
  application:
    name: hexo-backoffice

  # Active profile: override with -Dspring.profiles.active=prod on the server
  profiles:
    active: local

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations now; Hibernate only validates it matches.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  address: 127.0.0.1
  port: 8080

app:
  cors:
    allowed-origins: https://shchoglagpn.com.ua
  security:
    jwt:
      # Override with the JWT_SECRET env var in prod - must be at least 256 bits (32 chars).
      secret: ${JWT_SECRET:local-dev-only-secret-key-please-change-me-3242}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

keycrm:
  base-url: https://openapi.keycrm.app/v1
  # Prefer setting KEYCRM_API_TOKEN as an environment variable instead of committing real tokens.
  api-token: ${KEYCRM_API_TOKEN}

---
# ── LOCAL profile (Docker Postgres) ──────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/backoffice
    username: backoffice_user
    password: backoffice_pass
    driver-class-name: org.postgresql.Driver

---
# ── PROD profile (hosting Postgres) ──────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Postgres runs in Docker on the same VPS, bound to 127.0.0.1 only
    url: jdbc:postgresql://localhost:5432/backoffice
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver