spring:
  application:
    name: hexo-backoffice

  # Active profile: override with -Dspring.profiles.active=prod on the server
  profiles:
    active: local

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations now; Hibernate only validates it matches.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  cors:
    allowed-origins: https://shchoglagpn.com.ua

---
# ── LOCAL profile (Docker Postgres) ──────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/backoffice
    username: backoffice_user
    password: backoffice_pass
    driver-class-name: org.postgresql.Driver

---
# ── PROD profile (hosting Postgres) ──────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://YOUR_PROD_HOST:5432/backoffice
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: 8080
